[package]
name = "zerpto-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "What every Zerpto service shares: HTTP contract, validation, events, storage; optional clients for the IAM and relay services."

[features]
default = []
# NATS JetStream publishing (transactional outbox) and consuming.
events = ["dep:async-nats", "dep:futures-util"]
# Uploaded files: local disk and Cloudflare R2.
storage = ["loco-rs/storage_aws_s3"]
# The IAM service: gRPC authorization client (contract in `zerpto-proto`).
iam = ["dep:zerpto-proto"]
# Queue jobs to the relay service.
relay = ["loco-rs/worker_redis"]

[dependencies]
# Pinned here: every service shares this Loco version. Postgres only; SQLite is
# never compiled.
loco-rs = { version = "1.3", default-features = false, features = ["auth", "with-db", "db-postgres", "cache_inmem"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
async-trait = "0.1"
# Declarative request validation: `ValidatedJson` and the shared rules.
validator = { version = "0.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "v7"] }
bytes = "1"
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
# gRPC: the health service is generated from `proto/`.
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
# Error reporting. Does nothing unless SENTRY_DSN is set. rustls, not
# native-tls, so there is no OpenSSL dependency.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
async-nats = { version = "0.53", optional = true }
futures-util = { version = "0.3", optional = true }
# The shared gRPC contracts; only IAM's authorization client is used here.
zerpto-proto = { git = "https://github.com/zerpto/contract-proto", tag = "v0.1.0", features = ["iam"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
serde_json = "1"
# `#[tokio::test]` for the extractor tests.
tokio = { version = "1.45", features = ["macros", "rt"] }
